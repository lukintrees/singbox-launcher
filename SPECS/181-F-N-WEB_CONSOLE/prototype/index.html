<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LX Web Console — prototype (SPEC 181)</title>
<style>
:root{
  --bg:#0e1116;--bg2:#151a22;--bg3:#1c2330;--line:#252e3d;--fg:#e6ebf3;--fg2:#9aa7bb;
  --accent:#4c8dff;--ok:#3ecf8e;--warn:#e8b339;--err:#e5646a;--radius:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
 :root{--bg:#f4f6fa;--bg2:#fff;--bg3:#eef2f8;--line:#dbe2ec;--fg:#131923;--fg2:#5b6879;--accent:#2563eb;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:36px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
code,kbd{font-family:var(--mono);font-size:12.5px}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4c8dff,#8b5cf6)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--fg2);background:var(--bg3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg2)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}
nav{border-right:1px solid var(--line);background:var(--bg2);padding:12px 8px;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav .sec{color:var(--fg2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:12px 10px 6px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--fg);text-decoration:none;min-height:42px}
nav a:hover{background:var(--bg3)}
nav a.on{background:linear-gradient(90deg,rgba(76,141,255,.22),rgba(76,141,255,.05));box-shadow:inset 2px 0 0 var(--accent)}
nav a .badge{margin-left:auto;font-size:11px;color:var(--fg2)}
main{padding:18px 22px;overflow:auto}
h1{font-size:19px;margin:0 0 4px}
h2{font-size:15px;margin:22px 0 10px;color:var(--fg)}
.sub{color:var(--fg2);margin:0 0 16px;font-size:13px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--fg2)}.kv dd{margin:0;font-family:var(--mono);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--fg2);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr.sel{background:rgba(76,141,255,.10)}
tbody tr:hover{background:var(--bg3)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--fg2)}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--bg3);border:1px solid var(--line);font-size:11.5px;color:var(--fg2)}
.tag.ok{color:var(--ok);border-color:rgba(62,207,142,.4)}
.tag.warn{color:var(--warn);border-color:rgba(232,179,57,.4)}
.tag.err{color:var(--err);border-color:rgba(229,100,106,.4)}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;align-items:start}
@media (max-width: 900px){ .app{grid-template-columns:1fr} nav{display:none} .split,.g2,.g3{grid-template-columns:1fr} main{padding:14px} }
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 14px;overflow:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--fg2);padding:10px 12px;min-height:44px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.block{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--bg2)}
.block>summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center;min-height:44px}
.block>summary::-webkit-details-marker{display:none}
.block>summary::after{content:"▾";margin-left:auto;color:var(--fg2);transition:.15s}
.block[open]>summary::after{transform:rotate(180deg)}
.block .body{padding:2px 14px 14px;display:grid;gap:12px}
.f{display:grid;gap:5px}
.f label{font-size:12.5px;color:var(--fg2)}
.f .hint{font-size:11.5px;color:var(--fg2);opacity:.85}
.choices{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.choices button{padding:7px 12px;min-height:38px}
.choices button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.warnbox{border-left:3px solid var(--warn);background:rgba(232,179,57,.08);padding:10px 12px;border-radius:6px;font-size:12.5px}
.warnbox b{display:block;margin-bottom:2px}
.cmd{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cmd code{overflow:auto;white-space:nowrap}
.term{background:#080b0f;border:1px solid var(--line);border-radius:var(--radius);padding:12px;font-family:var(--mono);font-size:12px;height:260px;overflow:auto;white-space:pre-wrap}
.term .t{color:#5d6b80}.term .i{color:#7fb0ff}.term .w{color:#e8b339}.term .e{color:#e5646a}
.spark{display:flex;align-items:flex-end;gap:2px;height:44px}
.spark i{flex:1;background:linear-gradient(180deg,var(--accent),rgba(76,141,255,.25));border-radius:2px 2px 0 0;min-height:2px}
.toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:50}
.toast div{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.foot{margin:22px 0 8px;color:var(--fg2);font-size:12px}
.who{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.who div{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.who .n{font-size:22px;font-weight:600}
.who .l{color:var(--fg2);font-size:12px}
</style>
</head>

const $ = (s,r=document)=>r.querySelector(s);
const el = (t,attrs={},...kids)=>{const n=document.createElement(t);
  for(const[k,v]of Object.entries(attrs)){
    if(v===null||v===undefined||v===false) continue;
    if(k==='class')n.className=v; else if(k.startsWith('on'))n.addEventListener(k.slice(2),v); else n.setAttribute(k,v); }
  for(const c of kids.flat()) if(c!=null) n.append(c.nodeType?c:document.createTextNode(c));
  return n;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- registry-driven form (the real thing from contract/registry) ---------- */
function activeChoice(group, body){
  let fallback='',best='',score=0;
  for(const o of group.options){
    if(!o.paths || !o.paths.length){ if(!fallback) fallback=o.id; continue; }
    const hit=o.paths.some(p=>getPath(body,p)!==undefined); if(!hit) continue;
    let sc=0; const seen=new Set();
    for(const p of [...o.paths, ...Object.keys(o.set||{})]){ if(seen.has(p))continue; seen.add(p); if(getPath(body,p)!==undefined) sc++; }
    if(sc>score){best=o.id;score=sc;}
  }
  return best||fallback;
}
function getPath(o,p){ return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o); }
function visible(f,body){
  if(!f.vw) return true;
  for(const [p,want] of Object.entries(f.vw)){ const got=getPath(body,p); if((got===undefined?false:got)!==want) return false; }
  return true;
}
function fieldInput(path,f,body){
  const v = f.t==='ref' ? (f.ref==='tls' ? (getPath(body,'tls.enabled')?'tls':'') : '') : (getPath(body,path) ?? '');
  const id='f_'+path.replace(/\./g,'_');
  let inp;
  if(f.values && f.values.length){
    inp=el('select',{id}, el('option',{value:''},'Default'));
    for(const val of f.values){ if(val==='')continue; inp.append(el('option',{value:val, selected:(String(v)===val)?'selected':null}, val)); }
  } else if(f.t==='bool'){
    inp=el('select',{id}, el('option',{value:'', selected:(v!==true)?'selected':null},'off'), el('option',{value:'true', selected:(v===true)?'selected':null},'on'));
  } else if(f.secret){
    inp=el('input',{id,type:'password',value:v,placeholder:'••••••••',autocomplete:'off'});
  } else {
    inp=el('input',{id,type:'text',value:v,placeholder:(f.default??''),inputmode:(/port|mtu|mbps|jc|jmin|jmax|s[1-4]/.test(path)?'numeric':'text')});
  }
  const hint = f.en ? el('span',{class:'hint'}, f.en) : null;
  const label = (REG.labels[path] || path);
  return el('div',{class:'f'}, el('label',{for:id}, label, f.req?el('span',{class:'tag warn',style:'margin-left:6px'},'required'):null), inp, hint);
}
function renderForm(scheme, body){
  const S=REG.schemes[scheme]; const host=el('div');
  if(!S) return host;
  // choice groups first (security: none/tls/reality)
  for(const g of (S.form.choices||[])){
    const box = el('div',{class:'block',open:''}, el('summary',{}, 'Security: '+g.id));
    const inner=el('div',{class:'choices'});
    for(const o of g.options) inner.append(el('button',{class:(activeChoice(g,body)===o.id?'on':''),onclick:()=>toast('choice: '+g.id+' = '+o.id)},o.id));
    box.append(el('div',{class:'body'}, inner)); host.append(box);
  }
  const byBlock={};
  for(const path of S.order){
    const f=S.fields[path]; if(!f) continue;
    if(!visible(f,body)) continue;
    const b=f.block||'other'; (byBlock[b]=byBlock[b]||[]).push([path,f]);
  }
  // sub-schema fields (tls.*, transport.*) come from their own sections
  const tlsFields=[['tls.enabled',{t:'bool',block:'tls'}],['tls.server_name',{t:'string',block:'tls',en:'Server name (SNI) — only if it differs from the host'}],
                   ['tls.insecure',{t:'bool',block:'tls',en:'Skip certificate verification (dangerous)'}],
                   ['tls.alpn',{t:'list',block:'tls',en:'ALPN, comma-separated'}],
                   ['tls.utls.fingerprint',{t:'string',block:'tls',en:'uTLS fingerprint, e.g. chrome'}],
                   ['tls.reality.public_key',{t:'string',block:'tls',en:'REALITY public key'}],
                   ['tls.reality.short_id',{t:'string',block:'tls',en:'REALITY short id'}]];
  if(S.form.blocks.includes('tls')){
    const have=(byBlock.tls=byBlock.tls||[]);
    for(const [pp,f] of tlsFields) if(!have.some(([q])=>q===pp)) have.push([pp,f]);
  }
  // transport variants
  if(S.form.blocks.includes('transport')){
    const t=(byBlock.transport=byBlock.transport||[]);
    t.push(['transport.type',{t:'enum',values:Object.keys(REG.transport_variants),block:'transport',en:'V2Ray transport kind; empty = plain'}]);
    const cur=(getPath(body,'transport.type')||'');
    const variants=REG.transport_variants[cur]||{};
    for(const [p,f] of Object.entries(variants.params||{})) t.push(['transport.'+p,{...f,block:'transport'}]);
  }
  const order=['connection','tls','transport','advanced','amnezia','obfs','security','other'];
  for(const b of order){
    const fields=byBlock[b]; if(!fields||!fields.length) continue;
    const d=el('details',{class:'block',open:''}, el('summary',{}, b[0].toUpperCase()+b.slice(1)));
    const inside=el('div',{class:'body'});
    for(const [p,f] of fields) inside.append(fieldInput(p,f,body));
    d.append(inside); host.append(d);
  }
  return host;
}

          el('p',{class:'sub',style:'margin:6px 0 0'},'Body size 214 B · emitted URI matches the source link (round-trip verified by the contract corpus).')),
        renderForm('vless', body),
        el('div',{class:'row',style:'margin-top:6px'},
          el('button',{class:'primary',onclick:()=>toast('PUT /api/v1/state/nodes/vless-3 {…} → rev 43, config rebuilt')},'Save node'),
          el('button',{class:'ghost',onclick:()=>toast('POST /api/v1/emit → vless://…@nl1.example.com:443?…')},'Share URI'),
          el('button',{class:'ghost',onclick:()=>toast('DELETE /api/v1/state/nodes?tag=vless-3')},'Delete'))),
      el('div',{},
        el('div',{class:'card',style:'margin-bottom:12px'},
          el('h2',{style:'margin-top:0'},'Warnings'),
          el('div',{class:'warnbox'}, el('b',{},(REG.warnings['reality_fp_not_chrome']||{}).t_en||'REALITY fingerprint'),
            (REG.warnings['reality_fp_not_chrome']||{}).x_en||'')),
        el('div',{class:'card'},
          el('h2',{style:'margin-top:0'},'Body JSON'),
          el('pre',{class:'mono muted',style:'white-space:pre-wrap;margin:0'},JSON.stringify(body,null,2))))));
};
views.build=()=>el('div',{},el('h1',{},"Build config"),
  el('p',{class:'sub'},"Template + vars + nodes → config.json, with the build report (what was dropped and why). Same code path as the desktop Save."),
  el('div',{class:'split'},
    el('div',{class:'card'},el('h2',{style:'margin-top:0'},'Report'),
      ...[['template','ok','42 outbounds, 8 rules, 6 dns servers'],
          ['template_degraded','warn','vars[mtu] = "1500 " trimmed'],
          ['core_unsupported','warn','1 node dropped: naive (core 1.14.4-lx.30 has no naive)'],
          ['duplicates_collapsed','ok','subscription Liberty: 3 repeats collapsed']].map(([k,s,t])=>
        el('div',{class:'row',style:'padding:7px 0;border-bottom:1px solid var(--line)'},
          el('span',{class:'tag '+(s==='warn'?'warn':'ok')},k), el('span',{class:'mono muted'},t)))),
    el('div',{class:'card'},el('h2',{style:'margin-top:0'},'Deploy to router'),
      el('p',{class:'sub'},'Resources strictly before the config. Daemon validates and rolls back to last-good on reject.'),
      el('div',{class:'row'},el('button',{class:'primary',onclick:()=>toast('POST /api/v1/machines/router/deploy → 200, sha 9f2c…a1')},'Deploy'),
        el('button',{class:'ghost',onclick:()=>toast('GET /api/v1/machines/router/config/built')},'Preview JSON'))))
);
views.backup=()=>el('div',{},el('h1',{},"Backup"),
  el('p',{class:'sub'},"LX Backup 1.0 — the same file desktop and LxBox exchange. Export from the router, import on the phone, nothing silently lost: unpromotable bits come back as warnings."),
  el('div',{class:'grid g2'},
    el('div',{class:'card'},el('h2',{style:'margin-top:0'},'Export'),
      el('p',{class:'sub'},'subscriptions · rules · DNS · vars · disabled marks · per-machine profile'),
      el('button',{class:'primary',onclick:()=>toast('GET /api/v1/machines/router/backup/export → lx-backup-2026-11-12.json')},'Download')),
    el('div',{class:'card'},el('h2',{style:'margin-top:0'},'Import'),
      el('p',{class:'sub'},'either format; unknown keys reported, never applied silently'),
      el('button',{onclick:()=>toast('POST /api/v1/state/backup/import (dry run first)')},'Choose file…'))));
views.service=()=>{
  const cmds=el('div',{style:'display:grid;gap:8px'});
  for(const c of D.commands){
    cmds.append(el('div',{class:'cmd'},
      el('code',{},c.command),
      el('span',{class:'tag '+(c.state==='done'?'ok':'')},c.state+(c.exit!=null?' · exit '+c.exit:'')),
      el('span',{class:'row'},
        el('button',{class:'ghost',onclick:()=>toast('copied — paste it into your own ssh session')},'⧉'),
        el('button',{class:'ghost',onclick:()=>toast('POST /api/v1/daemon/commands/'+c.name)},'▶'))));
  }
  return el('div',{},el('h1',{},"Service"),
    el('p',{class:'sub'},"Diagnosis first, then the runbook (SPEC 161). Commands are shown and copied — never executed by the console: sudo stays in your terminal."),
    el('div',{class:'card',style:'margin-bottom:14px'},
      el('div',{class:'row'},el('span',{class:'tag ok'},'ok'),el('b',{},'Daemon is running'),
        el('span',{class:'muted mono'},D.local.executable+' · procd · lxd 1.14.4-lx.30'))),
    el('div',{class:'card'},el('h2',{style:'margin-top:0'},'Named commands from daemon.json'),
      el('p',{class:'sub'},'POST is body-less by contract; state and the log tail stream back over SSE.'),
      cmds),
    el('div',{class:'card',style:'margin-top:14px'},el('h2',{style:'margin-top:0'},'Reference'),
      el('dl',{class:'kv'},
        el('dt',{},'Service'),el('dd',{},'/etc/init.d/sing-box-lxd'),
        el('dt',{},'daemon.json'),el('dd',{},D.local.state_dir+'/daemon.json'),
        el('dt',{},'Core log'),el('dd',{},D.local.log_path),
        el('dt',{},'Persist'),el('dd',{},'log_size 8 MiB · 2 files'))));
};
views.logs=()=>{
  const t=el('div',{class:'term'});
  for(const [ts,lv,msg] of D.log) t.append(el('div',{},el('span',{class:'t'},ts+' '),el('span',{class:lv==='WARN'?'w':'i'},lv+' '),msg));
  const w=el('table',{},el('thead',{},el('tr',{},el('th',{},'time'),el('th',{},'op'),el('th',{},'code'),el('th',{},'took'))),el('tbody'));
  for(const [ts,op,code,took] of D.wire) w.querySelector('tbody').append(el('tr',{},el('td',{class:'mono'},ts),el('td',{class:'mono'},op),el('td',{class:'mono'},code),el('td',{class:'mono'},took)));
  return el('div',{},el('h1',{},"Logs"),
    el('p',{class:'sub'},"SSE topic log ← gRPC SubscribeLog; wire journal is metadata only (no bodies — config with node keys never lands in a log buffer)."),
    el('div',{class:'split'},el('div',{class:'card'},t),el('div',{class:'card'},el('h2',{style:'margin-top:0'},'Wire journal'),w)));
};
views.conns=()=>{
  const t=el('table',{},el('thead',{},el('tr',{},...['Process','Host','Dest','Outbound','Rule','↑','↓'].map(x=>el('th',{},x)))),el('tbody'));
  for(const c of D.conns) t.querySelector('tbody').append(el('tr',{},...c.map((x,i)=>el('td',{class:i>1?'mono':''},x))));
  return el('div',{},el('h1',{},"Connections"),
    el('p',{class:'sub'},"SSE topic conns ← gRPC SubscribeConnections. The routing decision is visible: which rule, which chain, which outbound."),
    el('div',{class:'card',style:'padding:0'},t));
};

/* ---------- router ---------- */
let cur={tab:'dash',tag:null};
function go(tab,tag){cur={tab,tag};[...$('#nav').querySelectorAll('a')].forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));
  $('#main').replaceChildren((views[tab]||views.dash)(cur));
  try{ history.replaceState(null,'','#'+tab+(tag?('/'+tag):'')); }catch(e){ location.hash=tab+(tag?('/'+tag):''); }
  $('#main').scrollTop=0;}
$('#nav').addEventListener('click',e=>{const a=e.target.closest('a'); if(!a)return; e.preventDefault(); go(a.dataset.tab);});
const initial=(location.hash||'').replace('#','').split('/');
go(views[initial[0]]?initial[0]:'dash', initial[1]||null);
setTimeout(()=>toast('prototype: data is synthetic, form layout is generated from contract/registry'),600);
</script>
